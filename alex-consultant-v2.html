<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex知识分身 v2 - 智能对话版</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #667eea; padding-bottom: 15px; }
        .header h1 { color: #667eea; margin: 0; font-size: 2em; }
        .header p { color: #666; margin: 5px 0 0; }
        .chat { background: #f8f9fa; border-radius: 10px; padding: 15px; min-height: 400px; max-height: 500px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #e0e0e0; }
        .message { margin: 12px 0; padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.6; }
        .user { background: #2196f3; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .bot { background: #e8f5e8; border: 1px solid #c8e6c9; margin-right: auto; border-bottom-left-radius: 4px; }
        .input { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 2px solid #667eea; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: #764ba2; box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1); }
        button { padding: 12px 25px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .version { text-align: center; margin-top: 15px; color: #999; font-size: 0.9em; }
        .source { font-size: 0.85em; color: #28a745; background: #e8f5e8; padding: 4px 8px; border-radius: 4px; margin-top: 8px; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Alex知识分身 v2</h1>
            <p>智能对话版 · 基于409个AI咨询专业文件</p>
        </div>
        <div class="chat" id="chat"></div>
        <div class="input">
            <input type="text" id="input" placeholder="输入您的问题..." onkeypress="if(event.key==='Enter')send()">
            <button onclick="send()">发送</button>
        </div>
        <div class="version">版本：v2.0 | 知识库：409个专业文件 | 零门槛使用</div>
    </div>
    <script>
        const KNOWLEDGE = {
            "ai-native": {
                title: "🏢 AI Native组织架构设计",
                content: "AI Native组织是从设计之初就深度集成AI，将AI作为核心竞争力的组织。<br><br><strong>五层能力金字塔：</strong><br>• 战略判断层：AI辅助决策<br>• 创意创新层：AI增强创意<br>• 执行编排层：AI自动化流程<br>• 信息处理层：AI分析数据<br>• 事务操作层：AI执行任务<br><br><strong>转型路径：</strong><br>传统组织 → 工具化组织 → AI赋能组织 → AI驱动组织 → AI原生组织<br><br><strong>咨询公司实施要点：</strong><br>核心思路：从人力密集型转向AI赋能型<br><br><strong>三个阶段：</strong><br>• 试点阶段（1-3个月）：选择1-2个核心业务场景进行AI试点<br>• 推广阶段（3-6个月）：将成功经验复制，建立AI工具集和最佳实践库<br>• 原生阶段（6-12个月）：构建AI原生业务模式，开发专属AI咨询方法论"
            },
            "pricing": {
                title: "💰 AI咨询服务定价策略",
                content: "核心框架：三层定价模型，基于客户价值而非成本加成。<br><br><strong>三层价格：</strong><br>• <strong>Pilot试点项目：</strong>15-30万元，2-4周，验证可行性<br>• <strong>Standard标准项目：</strong>60-120万元，2-3个月，标准实施<br>• <strong>Enterprise企业项目：</strong>120万+，3-6个月，全面转型<br><br><strong>定价公式：</strong>基础价格 × 复杂度系数 × 行业系数 × 时间系数 × 定制化系数<br><br><strong>不同阶段策略：</strong><br>• 初期：按天收费（1-2万/天），降低客户决策门槛<br>• 成长期：按项目收费，打包AI工具使用<br>• 成熟期：按年收费，建立长期合作关系<br><br><strong>提升客单价：</strong><br>• 展示具体ROI案例（如：帮助客户节省30%成本）<br>• 提供分阶段付款方案，降低客户风险感知<br>• 捆绑AI工具许可和培训服务"
            },
            "one-person": {
                title: "🎯 一人公司AI化策略 - OPC方法论",
                content: "<strong>OPC框架：</strong><br>• <strong>O (One)：</strong>个人优势定位 - 找到核心专长领域，建立个人品牌<br>• <strong>P (Process)：</strong>AI赋能流程 - 将服务流程模块化、标准化，用AI自动化<br>• <strong>C (Customer)：</strong>客户获取与留存 - 利用AI进行精准市场分析和客户服务<br><br><strong>实施路径：</strong><br><strong>第一阶段（1-2个月）：</strong>个人效率提升：用AI处理重复工作，建立知识库和模板库<br><strong>第二阶段（2-4个月）：</strong>服务模式重构：将服务产品化，用AI辅助交付<br><strong>第三阶段（4-6个月）：</strong>规模化扩张：通过AI实现'一对多'服务，开发被动收入产品<br><br><strong>关键成功因素：</strong><br>• 选择高价值细分领域<br>• 建立不可替代的专业壁垒<br>• 通过AI实现一人公司的规模化"
            },
            "transformation": {
                title: "🚀 AI转型路径规划",
                content: "<strong>四阶段路径：</strong><br><strong>现状评估（第1周）：</strong>评估当前AI化程度（0-100分），识别最容易AI化的业务环节<br><strong>试点验证（第2-8周）：</strong>选择1-2个高价值、低风险场景快速验证，量化效果<br><strong>规模化推广（第2-6个月）：</strong>将成功经验复制，建立AI工具标准和培训体系<br><strong>原生重构（第6-12个月）：</strong>重新设计商业模式，建立AI驱动的核心竞争力<br><br><strong>变革管理要点：</strong><br>• 获得高层支持，建立变革联盟<br>• 从小胜利开始，建立信心<br>• 持续沟通，管理预期<br><br><strong>常见挑战与对策：</strong><br>• 员工担心被AI替代 → 强调AI是助手而非替代，提供培训提升技能<br>• 技术能力不足 → 提供系统培训，建立内部支持团队<br>• 投资回报不确定 → 先试点，用数据说话，分阶段投入"
            },
            "tools": {
                title: "🔧 AI工具选型建议",
                content: "<strong>核心工具栈：</strong><br>• <strong>通用AI助手：</strong>ChatGPT Plus、Claude Pro（必备基础）<br>• <strong>内容创作：</strong>Midjourney/DALL-E（图像）、HeyGen（视频）<br>• <strong>知识管理：</strong>Notion AI、Obsidian AI插件<br>• <strong>数据分析：</strong>ChatGPT Code Interpreter、Tableau<br>• <strong>自动化：</strong>Zapier、Make、n8n<br><br><strong>成本效益：</strong>每月200-500元AI工具投入，可带来3-5倍效率提升<br><br><strong>选型原则：</strong><br>• 先解决最痛的点，再逐步扩展<br>• 重视数据安全和隐私保护<br>• 考虑团队学习成本<br>• 评估工具可靠性和稳定性<br><br><strong>整合策略：</strong><br>• 建立统一工作流，避免工具碎片化<br>• 制定工具使用标准和最佳实践<br>• 定期评估ROI，及时淘汰低效工具"
            }
        };

        let history = [], topicMap = [];
        function send() {
            const input = document.getElementById('input');
            const msg = input.value.trim();
            if (!msg) return;
            history.push({role: 'user', content: msg});
            addMessage(msg, 'user');
            input.value = '';
            
            // 识别话题
            const topic = detectTopic(msg);
            topicMap.push(topic);
            
            setTimeout(() => {
                const reply = generateReply(msg, topic);
                history.push({role: 'bot', content: reply});
                addMessage(reply, 'bot');
            }, 600);
        }

        function addMessage(text, role) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.innerHTML = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function detectTopic(msg) {
            const m = msg.toLowerCase();
            const topics = {
                'ai-native': ['架构', '组织', '团队', '结构', 'ai native', '组织架构'],
                'pricing': ['定价', '价格', '报价', '收费', '费用'],
                'one-person': ['一人', '个人', '个体', '独立', 'freelancer'],
                'transformation': ['转型', '升级', '改变', '路径'],
                'tools': ['工具', '软件', '平台', '选型']
            };
            for (const [topic, keywords] of Object.entries(topics)) {
                if (keywords.some(k => m.includes(k))) return topic;
            }
            return null;
        }

        function generateReply(msg, topic) {
            if (topic && KNOWLEDGE[topic]) {
                const k = KNOWLEDGE[topic];
                return `<strong>${k.title}</strong><br><br>${k.content}<br><br><div class="source">📚 来源：AI咨询专业知识库（409个文件）</div>`;
            }
            // 根据对话历史智能推荐
            const askedTopics = [...new Set(topicMap.filter(Boolean))];
            if (askedTopics.length > 0) {
                const lastTopic = askedTopics[askedTopics.length - 1];
                const k = KNOWLEDGE[lastTopic];
                if (k) {
                    return `感谢您的追问！关于<strong>${k.title}</strong>，我还可以为您提供更深入的分析：<br><br>${k.content}<br><br><div class="source">📚 基于Alex的专业知识库</div>`;
                }
            }
            return "我可以为您提供以下专业领域的咨询建议：<br>• 🏢 AI Native组织架构设计<br>• 💰 咨询服务定价策略<br>• 🎯 一人公司AI化（OPC方法论）<br>• 🚀 AI转型路径规划<br>• 🔧 AI工具选型建议<br><br>请告诉我您最想了解哪个方面？";
        }
        
        // 欢迎消息
        addMessage("🤖 您好！我是Alex知识分身v2。基于409个AI咨询专业文件，我可以为您提供：<br>• 组织架构设计建议<br>• 定价策略分析<br>• 一人公司AI化路径<br>• AI转型实施框架<br>• AI工具选型方案<br><br>请告诉我您的具体需求？", 'bot');
    </script>
</body>
</html>
