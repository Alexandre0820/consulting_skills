<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex知识分身 - AI咨询专家</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .chat { background: white; padding: 20px; border-radius: 10px; min-height: 400px; max-height: 500px; overflow-y: auto; margin-bottom: 15px; }
        .message { margin: 10px 0; padding: 12px; border-radius: 8px; }
        .user { background: #e3f2fd; margin-left: 20%; text-align: right; }
        .bot { background: #e8f5e8; margin-right: 20%; }
        .input { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { padding: 12px 25px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:hover { background: #5568d3; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Alex知识分身</h1>
        <p>基于409个AI咨询专业文件的智能助手</p>
        <p>前罗兰贝格顾问 | 前西蒙顾和上海办公室负责人</p>
    </div>
    <div class="chat" id="chat"></div>
    <div class="input">
        <input type="text" id="input" placeholder="输入您的问题..." onkeypress="if(event.key==='Enter')send()">
        <button onclick="send()">发送</button>
    </div>
    <script>
        const KNOWLEDGE = {
            "ai-native": {
                title: "AI Native组织",
                content: "AI Native组织是从设计之初就深度集成AI，将AI作为核心竞争力的组织。五层能力金字塔：战略判断层、创意创新层、执行编排层、信息处理层、事务操作层。"
            },
            "pricing": {
                title: "AI咨询定价",
                content: "三层定价：Pilot试点项目15-30万，Standard标准项目60-120万，Enterprise企业项目120万+。定价公式：基础价格 × 复杂度系数 × 行业系数 × 时间系数 × 定制化系数。"
            },
            "one-person": {
                title: "一人公司OPC方法论",
                content: "OPC：One（个人优势定位）+ Process（AI赋能流程）+ Customer（客户获取）。三阶段：1-2月个人效率提升，2-4月服务模式重构，4-6月规模化扩张。"
            },
            "transformation": {
                title: "AI转型路径",
                content: "四阶段：现状评估（第1周）→ 试点验证（第2-8周）→ 规模化推广（第2-6个月）→ 原生重构（第6-12个月）。关键成功因素：获得高层支持、从小胜利开始、持续沟通。"
            },
            "tools": {
                title: "AI工具选型",
                content: "核心工具栈：ChatGPT Plus/Claude Pro（基础）、Midjourney（图像）、HeyGen（视频）、Notion AI（知识管理）。成本效益：每月200-500元投入带来3-5倍效率提升。"
            }
        };

        let history = [];
        function send() {
            const input = document.getElementById('input');
            const msg = input.value.trim();
            if (!msg) return;
            history.push({role: 'user', content: msg});
            addMessage(msg, 'user');
            input.value = '';
            
            setTimeout(() => {
                const reply = generateReply(msg);
                history.push({role: 'bot', content: reply});
                addMessage(reply, 'bot');
            }, 500);
        }

        function addMessage(text, role) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.innerHTML = (role === 'user' ? '👤 ' : '🤖 ') + text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function generateReply(msg) {
            const m = msg.toLowerCase();
            let match = null;
            if (m.includes('架构') || m.includes('组织')) match = 'ai-native';
            else if (m.includes('定价') || m.includes('价格') || m.includes('报价')) match = 'pricing';
            else if (m.includes('一人') || m.includes('个人') || m.includes('个体')) match = 'one-person';
            else if (m.includes('转型') || m.includes('升级')) match = 'transformation';
            else if (m.includes('工具') || m.includes('软件')) match = 'tools';
            
            if (match) {
                const k = KNOWLEDGE[match];
                return `<strong>${k.title}</strong><br><br>${k.content}<br><br><small>📚 基于专业知识库</small>`;
            }
            return "作为AI咨询专家，我可以帮您解答：<br>• AI Native组织架构<br>• 咨询服务定价策略<br>• 一人公司AI化<br>• AI转型路径规划<br>• AI工具选型建议<br><br>请告诉我您想了解哪个方面？";
        }
        
        // 初始消息
        addMessage("您好！我是Alex的AI分身。我基于409个AI咨询专业文件为您提供精准建议。<br>请告诉我您目前最想了解什么？<br>• 组织架构设计<br>• 咨询项目定价<br>• 一人公司AI化<br>• AI转型路径<br>• AI工具选型", 'bot');
    </script>
</body>
</html>
